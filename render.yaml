# Render Blueprint for Anansi Atlas (Django web service + managed Postgres).
# Deploy: push to GitHub, then in Render → New → Blueprint → pick this repo.
# Render reads this file, creates the database and web service, and wires DATABASE_URL.
#
# After the first deploy you MUST set (Render dashboard → service → Environment):
#   ALLOWED_HOSTS         e.g.  anansiatlas.com,www.anansiatlas.com,anansi-atlas.onrender.com
#   CSRF_TRUSTED_ORIGINS  e.g.  https://anansiatlas.com,https://www.anansiatlas.com
# and, once an email provider is chosen, the EMAIL_* vars below.
# SECRET_KEY is generated automatically. DATABASE_URL is injected from the database.

databases:
  - name: anansi-atlas-db
    databaseName: anansi
    user: anansi
    region: virginia         # US East — closest to the Central Florida / US audience
    plan: basic-256mb        # free tier expires after 90 days — use a paid tier for a real launch

services:
  - type: web
    name: anansi-atlas
    runtime: python
    region: virginia         # MUST match the database region (they talk constantly)
    plan: starter            # avoids the free tier's cold-start sleep; bump to standard if needed
    branch: main
    buildCommand: "pip install -r requirements/web.txt && python manage.py collectstatic --noinput"
    preDeployCommand: "python manage.py migrate"   # runs once per deploy, before traffic switches
    startCommand: "gunicorn openoutreach.wsgi:application --workers 3 --timeout 120"
    healthCheckPath: /anansi-atlas/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: anansi-atlas-db
          property: connectionString
      # Wildcard ".onrender.com" matches whatever subdomain Render assigns (e.g. the -t3e2
      # suffix) so the health check always passes. Add/confirm the real custom domain here.
      - key: ALLOWED_HOSTS
        value: ".onrender.com,anansiatlas.com,www.anansiatlas.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://anansiatlas.com,https://www.anansiatlas.com"
      # ── Email (waitlist still saves to DB if unset; these enable confirmation sends). ──
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

  # ── Weekly "tracked opportunities" reminder ──
  # Once a week, emails each project owner the opportunities they've marked Interested
  # (★ Track) and haven't applied to yet — until they apply or un-track. Same web.txt
  # build (no daemon deps). Set the EMAIL_* vars on THIS service (same as the web
  # service) so reminders can send. Cron jobs are a paid Render feature.
  #
  # STATUS (2026-08-29): this job has never worked. Like the nurture cron it was
  # deployed with its EMAIL_* vars `sync: false` and unset, so every reminder since
  # creation died on ConnectionRefusedError and the run still reported success.
  # UNLIKE the nurture cron there is nothing dangerous behind it — the recipients
  # are real project owners (WOTR, EGI, Tech Sassy Girlz), a handful of addresses,
  # no bot queue. Setting the EMAIL_* vars in the dashboard is the whole fix, and
  # it is safe to do immediately. The command now exits non-zero on total failure.
  #
  # NOTE (2026-08-05): the refresh chain is NOT manual and is NOT only monthly, whatever
  # the comment above this one used to say. A dashboard-created cron "anansi-daily"
  # (crn-d92320gk1i2s738ihvmg, 0 9 * * *) runs it daily and is NOT described by this
  # blueprint — it was created by hand, so editing this file does not change it. Change
  # the chain here and you must change it there too, or the two drift. Both run:
  #     pull_grants_gov --all && send_opportunity_alerts
  #
  # expire_opportunities is deliberately NOT in that chain (Marcus's call, 2026-08-05):
  # run it by hand instead, from the Render shell:
  #     python manage.py expire_opportunities --dry-run   # list what would expire
  #     python manage.py expire_opportunities             # do it
  # Trade-off being accepted: between manual runs, grants whose deadline has passed stay
  # visible as open on client pipeline boards and in the alert digest, for any project
  # nobody opens (opening a project's pipeline page still sweeps that one project). On
  # 2026-08-05 that backlog was 28 rows across two live partners, oldest closed 13 days
  # earlier. Worth re-running whenever the digest goes out.
  # Gap 3B: observe the outreach mailboxes (read-only). Ingests replies and
  # bounces, correlates them to sent messages, pauses cold automation on a real
  # human reply, and surfaces what needs Marcus in the cockpit. Sends NOTHING.
  # Harmless before the Google setup is done: it exits cleanly when the
  # OUTREACH_*_MAILBOX / GOOGLE_SERVICE_ACCOUNT_JSON env vars are unset.
  - type: cron
    name: anansi-ingest-outreach-mail
    runtime: python
    region: virginia
    plan: starter
    branch: main
    buildCommand: "pip install -r requirements/web.txt"
    startCommand: "python manage.py ingest_outreach_mail"
    schedule: "*/30 * * * *"   # every 30 minutes
    # The freshness gate (mailbox_freshness_hold) counts on this job: without a
    # recent successful ingestion, autonomous sending fails closed. This envVars
    # block is load-bearing — the job first shipped without one and crash-looped
    # every 30 minutes (no SECRET_KEY/DATABASE_URL, Django never booted) while
    # "cron exists" read as "cron works". Gmail values are dashboard-managed
    # (sync: false): the service-account JSON is a secret, and the mailbox pair
    # lives beside it.
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: anansi-atlas-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,anansiatlas.com,www.anansiatlas.com"
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: OUTREACH_REPLY_MAILBOX
        value: "marcus@anansiatlas.com"
      - key: OUTREACH_BOUNCE_MAILBOX
        value: "mail@anansiatlas.com"

  - type: cron
    name: anansi-weekly-reminders
    runtime: python
    region: virginia
    plan: starter
    branch: main
    schedule: "0 13 * * 1"   # Mondays 13:00 UTC (weekly)
    buildCommand: "pip install -r requirements/web.txt"
    startCommand: "python manage.py send_interest_reminders"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: anansi-atlas-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,anansiatlas.com,www.anansiatlas.com"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: EMAIL_USE_SSL
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

  # ── Daily waitlist nurture sequence ──
  # Sends the due step (day 1 / 3 / 7 after signup) of the 3-email nurture sequence
  # to NEW/REVIEWED waitlist signups, then feeds completed sequences into the
  # SalesLead pipeline as Inbound/Nurturing so no lead falls out of view.
  #
  # WARNING (2026-08-29): this job has NEVER sent an email. It ran daily from
  # 2026-07-31 reporting "finished successfully" every time while every send died
  # on ConnectionRefusedError — the EMAIL_* vars below are `sync: false` and were
  # never given values, so Django fell back to localhost:25. The command now exits
  # non-zero when every send fails, so that cannot recur silently.
  #
  # SETTING THE EMAIL_* VARS IS THE DETONATOR, NOT THE FIX. There are ~4,132
  # InterestSignup rows queued behind this cron, overwhelmingly bot-generated, on a
  # domain being reputation-warmed at a handful of sends a day. Required order:
  #   1. deploy this code           (gates: opt-out, 30-day age-out, daily cap)
  #   2. manage.py retire_stale_signups --confirm    (drain the historical queue)
  #   3. THEN set the EMAIL_* vars + OUTREACH_MAILING_ADDRESS below
  # Doing 3 before 2 mails thousands of harvested addresses in one pass.
  #
  # Same EMAIL_* vars as the web service; SCHEDULING_URL optional (Cal.com link).
  # OUTREACH_MAILING_ADDRESS is required — nurture refuses to send a commercial
  # email without the CAN-SPAM postal address. NURTURE_DAILY_LIMIT caps attempted
  # sends per run (default 50 when unset).
  - type: cron
    name: anansi-daily-nurture
    runtime: python
    region: virginia
    plan: starter
    branch: main
    schedule: "30 14 * * *"   # daily 14:30 UTC (morning US Eastern)
    buildCommand: "pip install -r requirements/web.txt"
    startCommand: "python manage.py send_nurture_emails"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: anansi-atlas-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,anansiatlas.com,www.anansiatlas.com"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: EMAIL_USE_SSL
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SCHEDULING_URL
        sync: false
      - key: OUTREACH_MAILING_ADDRESS
        sync: false
      - key: NURTURE_DAILY_LIMIT
        value: "50"

  # ── Weekly link-health check ──
  # Probes every active ResourceProvider/Funder website and Opportunity source URL.
  # Deactivates rows only on dead DNS; 404s/timeouts are logged for human review.
  # No EMAIL_* vars needed — this job only reads/writes the database.
  - type: cron
    name: anansi-weekly-link-health
    runtime: python
    region: virginia
    plan: starter
    branch: main
    schedule: "0 11 * * 0"   # Sundays 11:00 UTC (weekly)
    buildCommand: "pip install -r requirements/web.txt"
    startCommand: "python manage.py check_link_health"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: anansi-atlas-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,anansiatlas.com,www.anansiatlas.com"

  # ── Monthly grants refresh ──
  # Re-pulls Grants.gov for every active project (geo/eligibility-aware ingestion),
  # then emails owners any new matches + upcoming deadlines. Idempotent upserts.
  # NOTE: nothing here drops grants whose deadline has passed — expire_opportunities is
  # run by hand (see the note above). Until it is run, this digest can advertise a
  # deadline the client can no longer make.
  - type: cron
    name: anansi-monthly-grants
    runtime: python
    region: virginia
    plan: starter
    branch: main
    schedule: "0 11 2 * *"   # 2nd of each month, 11:00 UTC
    buildCommand: "pip install -r requirements/web.txt"
    startCommand: "python manage.py pull_grants_gov --all && python manage.py send_opportunity_alerts"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: anansi-atlas-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,anansiatlas.com,www.anansiatlas.com"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: EMAIL_USE_SSL
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

  # ── Quarterly foundation refresh (990-PF) ──
  # Current filing year only (bounded runtime); FoundationGrantPaid dedup makes
  # reruns idempotent, so a timeout just means the next quarter catches up.
  - type: cron
    name: anansi-quarterly-foundations
    runtime: python
    region: virginia
    plan: starter
    branch: main
    schedule: "0 9 3 1,4,7,10 *"   # 3rd of Jan/Apr/Jul/Oct, 09:00 UTC
    buildCommand: "pip install -r requirements/web.txt"
    startCommand: "python manage.py pull_990pf_grants --years 2026 --derive-funders --no-resume"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: anansi-atlas-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,anansiatlas.com,www.anansiatlas.com"

  # ── Monthly website re-verification ──
  # Re-checks every client's profile claims against their live website; emails
  # owners only when NEW items go missing since last check (drift). Idempotent.
  - type: cron
    name: anansi-monthly-website-check
    runtime: python
    region: virginia
    plan: starter
    branch: main
    schedule: "0 12 5 * *"   # 5th of each month, 12:00 UTC
    buildCommand: "pip install -r requirements/web.txt"
    startCommand: "python manage.py rescan_websites"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: anansi-atlas-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,anansiatlas.com,www.anansiatlas.com"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: EMAIL_USE_SSL
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

  # ── Daily deadline + new-match alerts to project owners ──
  # ⚠️ DECLARED LATE (2026-09-01). This cron has existed on production since at
  # least July, running daily at 09:00 UTC, but was created in the dashboard and
  # was NOT in this Blueprint — so `render.yaml` described 7 crons while prod ran
  # 9. Anything reasoning about "all the send paths" from this file alone was
  # reasoning from an incomplete list, including the 2026-08-22 audit.
  #
  # It has never been able to send: like the other mail crons it has no EMAIL_*
  # values, so every send dies on ConnectionRefusedError. Since the Aug 29 fix it
  # at least fails loudly instead of exiting 0 — its 2026-09-01 run went red with
  # "Every alert send failed (1 attempted, 0 delivered)".
  #
  # Declaring it does NOT set those secrets (sync: false keeps them dashboard-only);
  # it makes the job visible to anyone reading this file, and puts it on the same
  # commit as everything else.
  #
  # Overlaps `anansi-monthly-grants`, which also ends in send_opportunity_alerts.
  # Whether both should exist is an open question — see the vault note.
  - type: cron
    name: anansi-daily
    runtime: python
    region: virginia
    plan: starter
    branch: main
    schedule: "0 9 * * *"   # daily 09:00 UTC
    buildCommand: "pip install -r requirements/web.txt"
    startCommand: "python manage.py send_opportunity_alerts"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: anansi-atlas-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,anansiatlas.com,www.anansiatlas.com"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: EMAIL_USE_SSL
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

  # ── NOT DECLARED ON PURPOSE: anansi-atlas-nurture (crn-d90s9s77f7vs73ctjc90) ──
  # A NINTH cron exists on production that is deliberately absent from this file.
  # It is a second nurture job (09:00 UTC daily), it is SUSPENDED, and it has not
  # been touched since 2026-08-06.
  #
  # It is not declared here because declaring a suspended service invites the
  # Blueprint to recreate/resume it, and this one sits on the nurture path — the
  # path that, with EMAIL_* set and the queue undrained, mails thousands of
  # harvested addresses. Waking it by accident is the worst outcome available.
  #
  # Resolve it deliberately, one of two ways, and then delete this comment:
  #   1. It is redundant with anansi-daily-nurture -> delete it in the dashboard.
  #   2. It is wanted -> drain/verify the queue first, then declare it properly.
  # Until then it stays suspended and visible here rather than invisible everywhere.
